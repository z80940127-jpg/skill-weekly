name: Publish weekly issue

on:
  workflow_dispatch:
  schedule:
    - cron: "0 8 * * 1"
      timezone: "Asia/Shanghai"

permissions:
  contents: write
  models: read

concurrency:
  group: publish-weekly-issue
  cancel-in-progress: false

jobs:
  publish:
    name: Generate and publish issue
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Shanghai
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Generate this week's issue
        run: npm run issue:generate -- --publish-date "$(date +%F)"

      - name: Verify production build
        run: npm run build

      - name: Commit a newly generated issue
        shell: bash
        run: |
          git add src/data/issues
          if git diff --cached --quiet -- src/data/issues; then
            echo "No new issue was generated."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "content: publish issue $(date +%F)"
          git push
